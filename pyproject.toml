[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak-scrapling"
version = "0.1.0"
description = "One-command CloakBrowser + Scrapling integration for AI Agent scraping."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cloak-scrapling contributors" },
]
keywords = [
    "ai-agent",
    "browser-automation",
    "cloakbrowser",
    "mcp",
    "scrapling",
    "scraping",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cloakbrowser>=0.3.30",
    "scrapling[all]>=0.4.8",
    "mcp>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "twine>=5.0",
    "wheel>=0.45",
]

[project.scripts]
cloak-scrapling-fetch = "cloak_scrapling.cli:main"
cloak-scrapling-shell = "cloak_scrapling.interactive:main"
cloak-scrapling-mcp = "cloak_scrapling.mcp_server:main"
cloak-scrapling-install-skill = "cloak_scrapling.install_skill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
cloak_scrapling = ["agent_skill/SKILL.md", "py.typed"]
