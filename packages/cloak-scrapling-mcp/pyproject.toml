[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloak-scrapling-mcp"
version = "0.1.1"
description = "uvx-friendly MCP server wrapper for cloak-scrapling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Cloak-scrapling contributors" },
]
keywords = [
    "ai-agent",
    "browser-automation",
    "cloak-scrapling",
    "mcp",
    "scraping",
    "uvx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "cloak-scrapling==0.1.1",
]

[project.scripts]
cloak-scrapling-mcp = "cloak_scrapling_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
cloak-scrapling = { workspace = true }
