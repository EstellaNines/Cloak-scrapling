<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cloak-scrapling 使用流程图</title>
  <desc id="desc">AI Agent 通过 Skill 和 MCP 调用 Cloak-scrapling，启动 CloakBrowser 并由 Scrapling 抽取网页内容。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38bdf8"/>
    </marker>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:38px;font-weight:800;fill:#f8fafc}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#cbd5e1}
      .box{fill:url(#card);stroke:#38bdf8;stroke-width:2;rx:22;filter:url(#shadow)}
      .box2{fill:#082f49;stroke:#22d3ee;stroke-width:2;rx:22;filter:url(#shadow)}
      .box3{fill:#312e81;stroke:#a78bfa;stroke-width:2;rx:22;filter:url(#shadow)}
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}
      .text{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#cbd5e1}
      .small{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#bae6fd}
      .arrow{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8;fill:none}
      .tag{fill:#0ea5e9;rx:10}
      .tagtext{font-family:Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#00111f}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="210" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="120" cy="650" r="240" fill="#8b5cf6" opacity="0.08"/>

  <text x="64" y="68" class="title">Cloak-scrapling：AI Agent 自动化爬虫链路</text>
  <text x="66" y="100" class="subtitle">Skill 负责告诉 Agent 何时使用工具；MCP 暴露 fetch/status/reset；CloakBrowser 提供隐身浏览器；Scrapling 完成内容抽取。</text>

  <rect x="58" y="150" width="205" height="132" class="box"/>
  <rect x="78" y="170" width="60" height="24" class="tag"/><text x="92" y="187" class="tagtext">STEP 1</text>
  <text x="82" y="222" class="label">AI Agent</text>
  <text x="82" y="250" class="text">Codex / Claude / Cursor</text>
  <text x="82" y="272" class="small">用户提出抓取任务</text>

  <rect x="322" y="150" width="205" height="132" class="box3"/>
  <rect x="342" y="170" width="60" height="24" class="tag"/><text x="356" y="187" class="tagtext">STEP 2</text>
  <text x="346" y="222" class="label">Agent Skill</text>
  <text x="346" y="250" class="text">安装到 skills 目录</text>
  <text x="346" y="272" class="small">CloakScrapling-Skill</text>

  <rect x="586" y="150" width="205" height="132" class="box2"/>
  <rect x="606" y="170" width="60" height="24" class="tag"/><text x="620" y="187" class="tagtext">STEP 3</text>
  <text x="610" y="222" class="label">MCP Server</text>
  <text x="610" y="250" class="text">stdio / streamable-http</text>
  <text x="610" y="272" class="small">cloak-scrapling-mcp</text>

  <rect x="850" y="150" width="205" height="132" class="box"/>
  <rect x="870" y="170" width="60" height="24" class="tag"/><text x="884" y="187" class="tagtext">STEP 4</text>
  <text x="874" y="222" class="label">CloakBrowser</text>
  <text x="874" y="250" class="text">启动隐身 Chromium</text>
  <text x="874" y="272" class="small">/json/version → ws://CDP</text>

  <rect x="586" y="382" width="205" height="132" class="box"/>
  <rect x="606" y="402" width="60" height="24" class="tag"/><text x="620" y="419" class="tagtext">STEP 5</text>
  <text x="610" y="454" class="label">Scrapling</text>
  <text x="610" y="482" class="text">CDP 控制与页面抽取</text>
  <text x="610" y="504" class="small">text / html / markdown</text>

  <rect x="322" y="382" width="205" height="132" class="box2"/>
  <rect x="342" y="402" width="60" height="24" class="tag"/><text x="356" y="419" class="tagtext">STEP 6</text>
  <text x="346" y="454" class="label">结果返回</text>
  <text x="346" y="482" class="text">MCP tool response</text>
  <text x="346" y="504" class="small">status / url / content</text>

  <rect x="850" y="382" width="205" height="132" class="box3"/>
  <rect x="870" y="402" width="60" height="24" class="tag"/><text x="884" y="419" class="tagtext">LOG</text>
  <text x="874" y="454" class="label">Sidecar Console</text>
  <text x="874" y="482" class="text">彩色输入/输出审计</text>
  <text x="874" y="504" class="small">SYSTEM / INPUT / OUTPUT</text>

  <path d="M263 216 H322" class="arrow"/>
  <path d="M527 216 H586" class="arrow"/>
  <path d="M791 216 H850" class="arrow"/>
  <path d="M952 282 C952 335 790 326 706 382" class="arrow"/>
  <path d="M586 448 H527" class="arrow"/>
  <path d="M424 382 C330 326 160 335 160 282" class="arrow"/>
  <path d="M791 448 H850" class="dash"/>
  <path d="M688 282 V382" class="dash"/>

  <rect x="64" y="584" width="1092" height="74" fill="#020617" stroke="#334155" stroke-width="1.5" rx="18"/>
  <text x="90" y="616" class="label" style="font-size:18px">典型命令</text>
  <text x="90" y="644" class="small">pip install cloak-scrapling  →  cloak-scrapling-install-skill --agent codex  →  configure MCP  →  Agent calls fetch(url, extraction_type, css_selector)</text>
</svg>
